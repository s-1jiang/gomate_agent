[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gomate-agent"
version = "0.1.0"
description = "GoMate local-life planning assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "pydantic==2.13.1",
    "pydantic-settings==2.9.1",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.17.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
