name: gomate

services:
  backend:
    image: gomate-backend
    build: &python-build
      context: .
      dockerfile: Dockerfile
    environment: &runtime-env
      TASK_EXECUTION_MODE: queue
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: gomate
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DATABASE_PATH: /app/data/gomate.db
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-86400}
      REMEMBER_TOKEN_TTL_SECONDS: ${REMEMBER_TOKEN_TTL_SECONDS:-2592000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-disabled}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-20}
      CHAT_HISTORY_CHARS: ${CHAT_HISTORY_CHARS:-40000}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-4096}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-240}
      MAX_TOOL_CALLS_PER_RUN: ${MAX_TOOL_CALLS_PER_RUN:-32}
      MAX_EXTERNAL_REQUESTS_PER_RUN: ${MAX_EXTERNAL_REQUESTS_PER_RUN:-48}
      MAX_LLM_CALLS_PER_RUN: ${MAX_LLM_CALLS_PER_RUN:-16}
      MAX_PARALLEL_TOOLS_PER_RUN: ${MAX_PARALLEL_TOOLS_PER_RUN:-4}
      MAP_TIMEOUT_SECONDS: ${MAP_TIMEOUT_SECONDS:-10}
      AMAP_MIN_INTERVAL_SECONDS: ${AMAP_MIN_INTERVAL_SECONDS:-1.1}
      TRANSIT_WALK_FALLBACK_METERS: ${TRANSIT_WALK_FALLBACK_METERS:-2000}
      MAX_REVIEW_ROUNDS: ${MAX_REVIEW_ROUNDS:-2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-12}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AMAP_JS_API_KEY: ${AMAP_JS_API_KEY:-}
      AMAP_JS_SECURITY_CODE: ${AMAP_JS_SECURITY_CODE:-}
      DEFAULT_CITY: ${DEFAULT_CITY:-}
    volumes:
      - gomate_data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [app]

  worker:
    image: gomate-backend
    build: *python-build
    command: ["python", "-m", "app.worker"]
    environment: *runtime-env
    volumes:
      - gomate_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/gomate-worker-heartbeat').stat().st_mtime<30"]
      interval: 10s
      timeout: 4s
      start_period: 15s
      retries: 3
    networks: [app]

  rabbitmq:
    image: rabbitmq:4-alpine
    user: rabbitmq
    hostname: gomate-rabbitmq
    environment:
      RABBITMQ_NODENAME: rabbit@gomate-rabbitmq
      RABBITMQ_DEFAULT_USER: gomate
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks: [app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:${GOMATE_WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [app]

volumes:
  gomate_data:
  rabbitmq_data:

networks:
  app:
